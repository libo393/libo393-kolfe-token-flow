<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Print QR - {{ user.full_name }}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @media print { .no-print { display: none; } }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 p-8 flex flex-col justify-center items-center min-h-screen">
    <div class="no-print mb-6">
        <a href="{{ url_for('admin_dashboard') }}" class="bg-emerald-600 hover:bg-emerald-500 text-slate-950 font-bold px-5 py-2.5 rounded-xl shadow-lg transition">⬅ Back to Dashboard</a>
    </div>
    
    <div class="bg-white text-slate-900 border-4 border-emerald-800 p-8 rounded-3xl w-96 text-center space-y-4 shadow-2xl">
        <span class="bg-emerald-100 text-emerald-800 text-xs px-3 py-1 rounded-full uppercase font-black tracking-wider">
    {{ user.sector or 'Kolfe-Keraniyo Beauty & Greenery Agency' }}
</span>
        <h2 class="text-2xl font-black text-slate-900">{{ user.full_name }}</h2>
        <p class="text-xs font-semibold text-slate-600">{{ user.position or 'Staff' }} (ID: {{ user.username }})</p>
        <div class="flex justify-center my-4 p-2 bg-slate-50 rounded-2xl border">
            <img src="data:image/png;base64,{{ qr_img }}" alt="QR" class="w-40 h-40">
        </div>
        <p class="text-xs text-slate-500">Scan this QR code at authorized merchant outlets to redeem service tokens.</p>
        <button onclick="window.print()" class="no-print w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-3 rounded-xl shadow transition">🖨️ Print ID Card</button>
    </div>
</body>
</html>
