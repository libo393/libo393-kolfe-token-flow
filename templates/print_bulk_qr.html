<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Bulk QR Print - {{ sector }}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @media print { .no-print { display: none; } }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 p-8">
    <div class="flex justify-between items-center mb-8 no-print container mx-auto">
        <a href="{{ url_for('admin_dashboard') }}" class="bg-emerald-700 hover:bg-emerald-600 text-white font-bold px-5 py-2.5 rounded-xl shadow transition">⬅ Back to Dashboard</a>
        <h1 class="text-2xl font-extrabold text-white">Bulk QR ID Cards (Sector: {{ sector }})</h1>
        <button onclick="window.print()" class="bg-amber-500 hover:bg-amber-400 text-slate-950 font-extrabold px-6 py-2.5 rounded-xl shadow-lg transition">🖨️ Print All Cards</button>
    </div>
    
    <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-6 container mx-auto">
        {% for emp in employees %}
        <div class="bg-white text-slate-900 border-2 border-emerald-700 p-6 rounded-3xl text-center space-y-3 shadow-xl break-inside-avoid">
            <span class="bg-emerald-100 text-emerald-800 text-xs px-3 py-1 rounded-full uppercase font-bold">{{ emp.sector }}</span>
            <h3 class="text-xl font-black text-slate-900">{{ emp.full_name }}</h3>
            <p class="text-xs font-semibold text-slate-600">{{ emp.position }} (ID: {{ emp.username }})</p>
            <div class="flex justify-center p-2 bg-slate-50 rounded-2xl border">
                <img src="data:image/png;base64,{{ emp.qr_img }}" alt="QR" class="w-32 h-32">
            </div>
        </div>
        {% endfor %}
    </div>
</body>
</html>
